<style>
#st-minimo{--st-bg:light-dark(#f5f6f2,#111d18);--st-text:light-dark(#20332b,#edf2eb);--st-sub:light-dark(#55695f,#a7b8ae);--st-line:light-dark(#cdd5cd,#3e5146);--st-field:light-dark(#e3ebe0,#233c2e);--st-mark:light-dark(#7d9480,#829b85);--st-button:light-dark(#fff,#1b2d23);--st-active:light-dark(#263e2e,#d4eb88);--st-active-text:light-dark(#fff,#172619);--st-a:light-dark(#225b9a,#80b9f0);--st-b:light-dark(#8b4b23,#e5b392);background:var(--st-bg);color:var(--st-text);font:14px/1.45 system-ui,sans-serif;padding:20px;border-radius:12px;box-sizing:border-box}
#st-minimo *{box-sizing:border-box}#st-minimo button{font:inherit;color:var(--st-text);background:var(--st-button);border:1px solid var(--st-line);border-radius:7px;min-height:44px;padding:9px 14px}#st-minimo button:disabled{opacity:.45}#st-minimo button[aria-pressed=true],#st-minimo .shot-button{background:var(--st-active);color:var(--st-active-text);border-color:var(--st-active)}#st-minimo .quiet{background:transparent;border-color:transparent;color:var(--st-sub)}#st-minimo header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--st-line)}#st-minimo .brand{font-weight:600}#st-minimo small{font-size:12px;color:var(--st-sub)}#st-minimo .score{display:flex;align-items:center;gap:12px;font-size:16px}#st-minimo .score strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}#st-minimo .clock{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}#st-minimo .clock button{padding:8px}#st-minimo .field-head{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:624px;margin:16px auto 10px;color:var(--st-sub);font-size:12px}#st-minimo .pitch{display:block;width:100%;max-width:624px;aspect-ratio:3/2;min-height:0;margin:0 auto;padding:0;border:0;border-radius:2px;background:var(--st-field);position:relative;overflow:hidden;touch-action:manipulation}#st-minimo .pitch svg{display:block;width:100%;height:100%;pointer-events:none}#st-minimo .pitch .lines{stroke:var(--st-mark);stroke-width:.45;fill:none}#st-minimo .trail{fill:none;stroke-width:.65;stroke-dasharray:1.2 1.4;opacity:.6}#st-minimo .toolbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto;max-width:900px}#st-minimo .teams{display:flex;align-items:center;gap:5px}#st-minimo .teams small{margin-right:4px}#st-minimo .commands{display:flex;gap:5px;align-items:center;flex-wrap:wrap}#st-minimo .tray{min-height:66px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0}#st-minimo .tray button{padding:7px 10px;min-height:38px}#st-minimo .tray [hidden]{display:none}#st-minimo .tray .results{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}#st-minimo .hint{color:var(--st-sub);margin:0;text-align:center}#st-minimo footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--st-sub);margin-top:16px;padding-top:10px;border-top:1px solid var(--st-line);font-size:12px}#st-minimo .live-status{min-width:0}#st-minimo .pending{border:0;background:transparent;text-decoration:underline;padding:0;min-height:28px;color:var(--st-sub);font-size:12px}#st-minimo .score-a{color:var(--st-a)}#st-minimo .score-b{color:var(--st-b)}
@media(max-width:580px){#st-minimo{padding:12px}#st-minimo header{flex-wrap:wrap;gap:8px}#st-minimo .brand{font-size:12px}#st-minimo .score{gap:7px;font-size:14px}#st-minimo .clock{width:100%;justify-content:space-between}#st-minimo .clock button{min-height:32px;padding:4px 8px}#st-minimo .toolbar{gap:8px}#st-minimo .teams,#st-minimo .commands{justify-content:center;width:100%}#st-minimo .toolbar button{padding:9px 10px}#st-minimo .tray{min-height:90px}#st-minimo footer{align-items:flex-start}}
#st-minimo [hidden]{display:none !important}
</style>
<section id="st-minimo" aria-label="Prévia do registro minimalista de futebol">
 <header>
  <div><div class="brand">Scout Trainer</div><small>Registro · prévia</small></div>
  <div class="score"><span class="score-a">Azul</span><strong data-score>0 × 0</strong><span class="score-b">Branco</span></div>
  <div class="clock"><span>1º T · <span data-clock>12:34</span></span><button type="button" class="quiet cursor-interaction" data-pause>Pausar coleta</button></div>
 </header>
 <div class="field-head"><span data-control>Azul com a bola</span><span>Azul ataca →</span></div>
 <button type="button" class="pitch cursor-interaction" aria-label="Campo: toque para marcar a bola; use as setas e Enter no teclado" data-pitch>
  <svg viewBox="0 0 120 80" aria-hidden="true">
   <g class="lines"><rect x="3" y="3" width="114" height="74"/><path d="M60 3V77"/><circle cx="60" cy="40" r="9"/><circle cx="60" cy="40" r=".5"/><path d="M3 19H20V61H3 M117 19H100V61H117 M3 30H9V50H3 M117 30H111V50H117 M20 33Q27 40 20 47 M100 33Q93 40 100 47"/><circle cx="15" cy="40" r=".5"/><circle cx="105" cy="40" r=".5"/></g>
   <g data-marks></g>
  </svg>
 </button>
 <div class="tray" aria-live="polite">
  <p class="hint" data-hint>Toque no campo para mover a bola.</p>
  <div class="results" data-results hidden aria-label="Resultado da finalização">
   <button type="button" class="cursor-interaction" data-result="goal">Gol</button><button type="button" class="cursor-interaction" data-result="saved">Defendida</button><button type="button" class="cursor-interaction" data-result="off">Fora</button><button type="button" class="cursor-interaction" data-result="blocked">Bloqueada</button><button type="button" class="cursor-interaction" data-result="post">Trave</button><button type="button" class="quiet cursor-interaction" data-later>Depois</button>
  </div>
 </div>
 <div class="toolbar" aria-label="Registro rápido">
  <div class="teams" aria-label="Quem tem a posse"><small>Posse</small><button type="button" class="cursor-interaction" data-team="A" aria-pressed="true">Azul</button><button type="button" class="cursor-interaction" data-team="B" aria-pressed="false">Branco</button><button type="button" class="quiet cursor-interaction" data-free aria-pressed="false">Disputa</button></div>
  <div class="commands"><button type="button" class="shot-button cursor-interaction" data-shot>Finalizar</button><button type="button" class="quiet cursor-interaction" data-dead aria-pressed="false">Parada</button><button type="button" class="quiet cursor-interaction" data-undo disabled>Desfazer</button></div>
 </div>
 <footer><span class="live-status" data-status>Última posição observada · Azul</span><button type="button" class="pending cursor-interaction" data-pending hidden></button><span data-note>Dados fictícios</span></footer>
</section>
<script>
(()=>{
 const root=document.getElementById('st-minimo');
 const q=s=>root.querySelector(s);const names={A:'Azul',B:'Branco'};
 const options={trail:true};
 let state={control:'A',last:{x:30,y:47,team:'A'},trail:[{x:30,y:47,team:'A'}],events:[],activeShot:null,armed:false,paused:false,message:'Última posição observada · Azul',sequence:0};
 let undo=[];let focusPoint={x:60,y:40};const started=Date.now();
 const snapshot=()=>JSON.parse(JSON.stringify(state));
 function remember(){undo.push(snapshot());undo=undo.slice(-20)}
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{proposta:'Registro de futebol com campo e faixa única',controle:state.control,marcacoes:state.events.length,trilha:options.trail},privateContent:{state:snapshot(),undo:undo.slice(-10),trail:options.trail}}).catch(()=>{})}
 function restore(saved){const v=saved?.privateContent;if(v?.state&&Array.isArray(v.state.events)&&['A','B','free','dead','unknown'].includes(v.state.control)){state=v.state;undo=Array.isArray(v.undo)?v.undo.slice(-10):[];options.trail=v.trail!==false;render()}}
 function add(kind,extra={}){const event={id:++state.sequence,kind,team:['A','B'].includes(state.control)?state.control:null,...extra};state.events.push(event);state.events=state.events.slice(-60);return event}
 function render(){
  const active=state.events.find(e=>e.id===state.activeShot&&e.kind==='shot'&&!e.result);
  if(!active)state.activeShot=null;
  const known=['A','B'].includes(state.control);
  q('[data-control]').textContent=state.paused?'Coleta pausada':known?names[state.control]+' com a bola':({free:'Bola em disputa',dead:'Bola parada',unknown:'Controle a confirmar'})[state.control];
  root.querySelectorAll('[data-team]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.team===state.control));b.disabled=state.paused});
  q('[data-free]').setAttribute('aria-pressed',String(state.control==='free'));q('[data-dead]').setAttribute('aria-pressed',String(state.control==='dead'));
  q('[data-shot]').textContent=state.armed?'Cancelar chute':'Finalizar';q('[data-shot]').disabled=state.paused||(!known&&!state.armed);
  q('[data-free]').disabled=state.paused;q('[data-dead]').disabled=state.paused;q('[data-pitch]').disabled=state.paused;
  q('[data-pause]').textContent=state.paused?'Retomar coleta':'Pausar coleta';q('[data-undo]').disabled=!undo.length;
  q('[data-results]').hidden=!active;q('[data-hint]').hidden=!!active;
  q('[data-hint]').textContent=state.paused?'Retome quando puder acompanhar o jogo.':state.armed?'Marque no campo de onde saiu o chute.':state.control==='dead'?'Selecione a equipe quando o jogo recomeçar.':known?'Toque no campo para mover a bola.':'Selecione a equipe quando ela controlar a bola.';
  q('[data-status]').textContent=active?`Chute de ${names[active.team]} · resultado pendente`:state.message;
  const pending=state.events.filter(e=>e.kind==='shot'&&!e.result);q('[data-pending]').hidden=pending.length===0;q('[data-pending]').textContent=pending.length+' chute'+(pending.length===1?'':'s')+' pendente'+(pending.length===1?'':'s');
  const goals=t=>state.events.filter(e=>e.kind==='shot'&&e.team===t&&e.result==='goal').length;q('[data-score]').textContent=goals('A')+' × '+goals('B');
  const holder=q('[data-marks]');holder.replaceChildren();
  const node=(tag,attrs)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,String(v));holder.appendChild(n);return n};
  const color=t=>t==='B'?'var(--st-b)':'var(--st-a)';
  if(options.trail&&state.trail.length>1)node('polyline',{points:state.trail.slice(-5).map(p=>`${p.x},${p.y}`).join(' '),class:'trail',stroke:color(state.trail.at(-1).team)});
  if(state.last){const p=state.last;const fresh=p.team===state.control;node('circle',{cx:p.x,cy:p.y,r:1.8,fill:fresh?color(p.team):'var(--st-field)',stroke:color(p.team),'stroke-width':.8});node('circle',{cx:p.x,cy:p.y,r:3.2,fill:'none',stroke:color(p.team),'stroke-width':.3,opacity:.6})}
 }
 function changeControl(control){if(state.paused||state.control===control)return;remember();state.control=control;state.armed=false;state.trail=[];state.activeShot=null;add('control',{control});state.message=names[control]?`Posse de ${names[control]} registrada`:control==='free'?'Disputa registrada':'Parada registrada';render();save()}
 function point(x,y){if(state.paused)return;remember();const p={x:Math.max(3,Math.min(117,x)),y:Math.max(3,Math.min(77,y)),team:['A','B'].includes(state.control)?state.control:null};state.last=p;
  if(state.armed&&p.team){const shot=add('shot',{point:p,result:null});state.activeShot=shot.id;state.armed=false;state.control='unknown';state.trail=[];state.message='Finalização registrada'}else{add('point',{point:p});state.trail.push(p);state.trail=state.trail.slice(-5);state.activeShot=null;state.message='Posição registrada'+(p.team?' · '+names[p.team]:' · controle não observado')}
  render();save();
 }
 root.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',()=>changeControl(b.dataset.team)));
 q('[data-free]').addEventListener('click',()=>changeControl('free'));q('[data-dead]').addEventListener('click',()=>changeControl('dead'));
 q('[data-shot]').addEventListener('click',()=>{state.armed=!state.armed;state.activeShot=null;render();save()});
 q('[data-pause]').addEventListener('click',()=>{remember();state.paused=!state.paused;state.armed=false;state.activeShot=null;state.control='unknown';state.trail=[];state.message=state.paused?'Observação interrompida':'Selecione quem controla a bola';render();save()});
 q('[data-pitch]').addEventListener('click',e=>{if(e.detail===0){point(focusPoint.x,focusPoint.y);return}const b=e.currentTarget.getBoundingClientRect();point((e.clientX-b.left)/b.width*120,(e.clientY-b.top)/b.height*80)});
 q('[data-pitch]').addEventListener('keydown',e=>{const move={ArrowLeft:[-3,0],ArrowRight:[3,0],ArrowUp:[0,-3],ArrowDown:[0,3]}[e.key];if(move){e.preventDefault();focusPoint={x:Math.max(3,Math.min(117,focusPoint.x+move[0])),y:Math.max(3,Math.min(77,focusPoint.y+move[1]))};q('[data-status]').textContent=`Alvo: ${Math.round(focusPoint.x/120*100)}% × ${Math.round(focusPoint.y/80*100)}% · Enter para marcar`}});
 root.querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',()=>{const shot=state.events.find(e=>e.id===state.activeShot);if(!shot)return;remember();shot.result=b.dataset.result;state.activeShot=null;if(['goal','off'].includes(shot.result)&&state.events.at(-1)?.id===shot.id){state.control='dead';state.trail=[]}state.message=`Chute de ${names[shot.team]} · ${b.textContent}`;render();save()}));
 q('[data-later]').addEventListener('click',()=>{state.activeShot=null;state.message='Chute salvo; resultado para revisar';render();save()});
 q('[data-pending]').addEventListener('click',()=>{state.activeShot=state.events.find(e=>e.kind==='shot'&&!e.result)?.id??null;state.armed=false;render();save()});
 q('[data-undo]').addEventListener('click',()=>{if(!undo.length)return;state=undo.pop();render();save()});
 root.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='Escape'){state.armed=false;state.activeShot=null;render();save()}if(e.key.toLowerCase()==='f'&&!q('[data-shot]').disabled){e.preventDefault();q('[data-shot]').click()}});
 function clock(){const s=754+Math.floor((Date.now()-started)/1000);q('[data-clock]').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 const timer=setInterval(()=>{if(!root.isConnected){clearInterval(timer);return}clock()},1000);
 render();restore(window.openai?.widgetState);
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save()}});tweak.addToggle(options,'trail',{label:'Mostrar trilha curta da posse'})}
})();
</script>
